[project]
name = "school-portal"
version = "0.2.0"
description = "Daily diary, attendance and messages for a nursery or primary school"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "flask==3.1.*",
    "flask-sqlalchemy==3.1.*",
    "sqlalchemy==2.0.*",
    "alembic==1.14.*",
    "psycopg[binary]==3.2.*",
    "flask-login==0.6.*",
    "flask-wtf==1.2.*",
    "wtforms==3.2.*",
    "email-validator==2.2.*",
    "pillow==11.*",
    "gunicorn==23.*",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "ruff==0.8.*",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["school_portal*"]

[tool.setuptools.package-data]
school_portal = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Demo data reads better with whole sentences on one line.
"school_portal/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:flask_login.*"]
