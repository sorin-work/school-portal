{% set day = days[child.id] if days is defined else day %}
{% set classes = "tile w-full" %}
<div id="tile-{{ child.id }}" {% if oob %}hx-swap-oob="true"{% endif %}>
  <button type="button" class="{{ classes }}"
    hx-get="{{ url_for('room_view.panel', room_id=room.id, child_id=child.id) }}" hx-target="#panel" hx-swap="innerHTML">
    <span class="flex items-center justify-between gap-2">
      <span class="text-base font-semibold">{{ child.short_name }}</span>
      {% if child.has_allergies %}<span class="badge badge-red" title="{{ child.allergies }}">Allergy</span>{% endif %}
    </span>
    <span class="mt-1 text-xs text-stone-600">
      {% if day.open_nap %}Asleep since {{ day.open_nap.occurred_at|time }}{% elif day.last %}{{ day.last.summary() }}, {{ day.last.occurred_at|time }}{% else %}Nothing logged yet{% endif %}
    </span>
  </button>
</div>
