{% extends "base.html" %}
{% from "partials/forms.html" import field %}
{% block title %}Sign in · {{ school_name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="page-title">Sign in</h1>
  <form method="post" class="card space-y-4" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.email) }}
    {{ field(form.password) }}
    <button class="btn btn-primary w-full" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
