name: school-portal

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5463:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  db-data:
