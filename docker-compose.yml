name: school-portal

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5463:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://school:school@db:5432/school
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret-change-me}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:4433}
      SCHOOL_TIMEZONE: ${SCHOOL_TIMEZONE:-Europe/London}
      # Creates the invented demo school on first start.
      SEED_DEMO: ${SEED_DEMO:-true}
      # Lists the demo accounts on the sign-in page.
      SHOW_DEMO_LOGINS: ${SHOW_DEMO_LOGINS:-true}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4433:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  db-data:
  uploads:
